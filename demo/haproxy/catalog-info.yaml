apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: resiliency-group
  description: Platform Resiliency & Edge TLS Reliability Engineering Group
spec:
  type: team
  profile:
    displayName: Resiliency Engineering
    email: resiliency-group@example.com
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: hello-world-app
  description: Sandbox Hello World application fronted by HAProxy
  tags:
    - env:dev
    - env:stg
    - env:stress-test
    - env:preprod
    - env:prod
    - ssl-monitored
    - haproxy-edge
    - ingress:internet-facing
    - dns:private-split-horizon
  annotations:
    resiliency.idp/exposure-scope: 'internet-facing'
    resiliency.idp/dns-scope: 'private-split-horizon'
    resiliency.idp/ingress-type: 'Edge Reverse Proxy & HAProxy TLS Gateway'
    resiliency.idp/software-stack: '[{"name":"HAProxy","version":"3.0.0","category":"reverse-proxy","description":"Master-worker edge load balancer & TLS terminator"},{"name":"Node.js","version":"22.14.0","category":"runtime","description":"Upstream container microservice"},{"name":"OpenSSL","version":"3.2.1","category":"crypto-library","description":"Edge TLS 1.3 protocol engine"},{"name":"Alpine Linux","version":"3.20","category":"runtime","description":"Hardened minimal container OS"}]'
    resiliency.idp/ssl-provider: 'haproxy-edge'
    resiliency.idp/ssl-renewal-mode: 'manual-or-template'
    resiliency.idp/endpoints.dev: 'https://dev.hello.internal:8443/healthz'
    resiliency.idp/endpoints.stg.east: 'https://stg-east.hello.internal:8443/healthz'
    resiliency.idp/endpoints.stg.west: 'https://stg-west.hello.internal:8443/healthz'
    resiliency.idp/endpoints.stress-test: 'https://stress.hello.internal:8443/healthz'
    resiliency.idp/endpoints.preprod: 'https://preprod.hello.internal:8443/healthz'
    resiliency.idp/endpoints.prod: 'https://hello.internal:8443/healthz'
  links:
    - url: https://127.0.0.1:8443
      title: Live HAProxy HTTPS Endpoint
      icon: web
    - url: http://localhost:3000/create/templates/default/update-haproxy-tls-cert?formData=%7B%22certEntity%22%3A%22resource%3Adefault%2Fhaproxy-hello-world-tls%22%7D
      title: Rotate Certificate
      icon: key
spec:
  type: service
  lifecycle: experimental
  owner: group:resiliency-group
  dependsOn:
    - resource:default/haproxy-hello-world-tls
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: haproxy-hello-world-tls
  description: HAProxy Frontend TLS Certificate for Hello World App
  tags:
    - env:dev
    - env:stg
    - env:stress-test
    - env:preprod
    - env:prod
    - ssl-monitored
    - haproxy-edge
    - ingress:internet-facing
    - dns:private-split-horizon
  annotations:
    resiliency.idp/exposure-scope: 'internet-facing'
    resiliency.idp/dns-scope: 'private-split-horizon'
    resiliency.idp/ingress-type: 'Edge Reverse Proxy & HAProxy TLS Gateway'
    resiliency.idp/software-stack: '[{"name":"HAProxy","version":"3.0.0","category":"reverse-proxy","description":"Master-worker edge load balancer & TLS terminator"},{"name":"OpenSSL","version":"3.2.1","category":"crypto-library","description":"Edge TLS 1.3 protocol engine"}]'
    resiliency.idp/cert-provider: "Self-Signed (OpenSSL)"
    resiliency.idp/cert-version: "v1 (Serial: 03:E3:06:3C:B7:AF:03:9C:3B:8C:5B:0E:7F:BD:B1:6C:67:71:E1:C1)"
    resiliency.idp/cert-expiry: "2027-01-24T18:05:10.000Z"
    resiliency.idp/days-remaining: "90"
    resiliency.idp/cert-status: "Healthy"
    resiliency.idp/haproxy-host: "127.0.0.1:8443"
    resiliency.idp/haproxy-pem-path: "/etc/haproxy/certs/hello-world.pem"
    resiliency.idp/ssl-provider: 'haproxy-edge'
    resiliency.idp/ssl-renewal-mode: 'manual-or-template'
    resiliency.idp/endpoints.dev: 'https://dev.hello.internal:8443/healthz'
    resiliency.idp/endpoints.stg: 'https://stg.hello.internal:8443/healthz'
    resiliency.idp/endpoints.stress-test: 'https://stress.hello.internal:8443/healthz'
    resiliency.idp/endpoints.preprod: 'https://preprod.hello.internal:8443/healthz'
    resiliency.idp/endpoints.prod: 'https://hello.internal:8443/healthz'
  links:
    - url: http://localhost:3000/create/templates/default/update-haproxy-tls-cert?formData=%7B%22certEntity%22%3A%22resource%3Adefault%2Fhaproxy-hello-world-tls%22%7D
      title: Rotate Certificate
      icon: key
spec:
  type: tls-certificate
  owner: group:resiliency-group
