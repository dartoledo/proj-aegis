global
    # Enable Runtime API socket for zero-downtime cert updates
    stats socket /var/run/haproxy/haproxy.sock mode 666 level admin expose-fd listeners
    stats socket /var/run/haproxy.sock mode 666 level admin expose-fd listeners
    stats timeout 30s

defaults
    mode http
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/hello-world.pem
    bind *:8443 ssl crt /etc/haproxy/certs/hello-world.pem
    default_backend hello_world_app

backend hello_world_app
    server app1 127.0.0.1:8080 check
