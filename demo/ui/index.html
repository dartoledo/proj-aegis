<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Platform - Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Animated Background Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: float 10s infinite ease-in-out alternate;
        }
        .orb-1 { width: 300px; height: 300px; background: rgba(99, 102, 241, 0.3); top: -100px; left: -100px; }
        .orb-2 { width: 400px; height: 400px; background: rgba(139, 92, 246, 0.2); bottom: -150px; right: -100px; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 50px); }
        }

        /* Glass Container */
        .container {
            position: relative;
            z-index: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(to right, #a5b4fc, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p { color: var(--text-muted); font-size: 14px; }

        /* Form Elements */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39);
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        /* Dashboard State */
        #dashboard { display: none; }
        
        .data-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-online { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .status-offline { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .error-msg {
            color: #f87171;
            font-size: 13px;
            margin-top: -10px;
            margin-bottom: 15px;
            text-align: center;
            display: none;
        }

        /* Loader */
        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Login View -->
    <div class="container" id="login-view">
        <div class="header">
            <h1>Aegis Auth</h1>
            <p>Enter your CIAM credentials to access the portal</p>
        </div>
        
        <div class="error-msg" id="error-msg">Invalid credentials</div>

        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter 'admin'" value="admin">
        </div>
        
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter 'admin'" value="admin">
        </div>

        <button id="login-btn">
            <span id="btn-text">Authenticate</span>
            <div class="loader" id="btn-loader"></div>
        </button>
    </div>

    <!-- Dashboard View -->
    <div class="container" id="dashboard" style="max-width: 600px;">
        <div class="header">
            <h1>CIAM Services Status</h1>
            <p>Live data fetched securely via JWT</p>
        </div>
        
        <div id="data-container">
            <!-- Data populated here -->
        </div>

        <button onclick="logout()" style="margin-top: 20px; background: rgba(255,255,255,0.1); box-shadow: none;">Logout</button>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost' ? 'http://localhost' : '';
        let token = localStorage.getItem('aegis_token');

        // Check if already logged in
        if (token) {
            showDashboard();
        }

        document.getElementById('login-btn').addEventListener('click', async () => {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            setLoading(true);
            document.getElementById('error-msg').style.display = 'none';

            try {
                // auth exposed on NodePort 30001
                const res = await fetch(`http://localhost:30001/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await res.json();
                
                if (res.ok) {
                    token = data.token;
                    localStorage.setItem('aegis_token', token);
                    showDashboard();
                } else {
                    showError(data.error || 'Authentication failed');
                }
            } catch (err) {
                showError('Auth service is unreachable. Is Kubernetes running?');
            } finally {
                setLoading(false);
            }
        });

        async function showDashboard() {
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            
            const container = document.getElementById('data-container');
            container.innerHTML = '<div class="loader" style="display:block; margin: 40px auto;"></div>';

            try {
                // backend exposed on NodePort 30002
                const res = await fetch(`http://localhost:30002/api/data`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 401 || res.status === 403) {
                    logout();
                    return;
                }

                const data = await res.json();
                container.innerHTML = '';

                data.forEach(item => {
                    const statusClass = item.status.toLowerCase() === 'online' ? 'status-online' : 'status-offline';
                    container.innerHTML += `
                        <div class="data-card">
                            <div style="font-weight: 600;">${item.name}</div>
                            <div class="status-badge ${statusClass}">${item.status}</div>
                        </div>
                    `;
                });
            } catch (err) {
                container.innerHTML = '<p style="text-align:center; color: #f87171;">Failed to fetch data. Is the backend running?</p>';
            }
        }

        function logout() {
            localStorage.removeItem('aegis_token');
            token = null;
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('login-view').style.display = 'block';
        }

        function setLoading(isLoading) {
            document.getElementById('btn-text').style.display = isLoading ? 'none' : 'block';
            document.getElementById('btn-loader').style.display = isLoading ? 'block' : 'none';
        }

        function showError(msg) {
            const errEl = document.getElementById('error-msg');
            errEl.innerText = msg;
            errEl.style.display = 'block';
        }
    </script>
</body>
</html>
