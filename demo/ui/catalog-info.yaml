apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: aegis-ui
  description: The stunning frontend interface for Project Aegis
  tags:
    - env:dev
    - env:stg
    - env:stress-test
    - env:preprod
    - env:prod
    - ssl-monitored
    - gcp-cloud-lb
    - ingress:internet-facing
    - dns:public-authoritative
  annotations:
    backstage.io/kubernetes-label-selector: 'app=ui'
    backstage.io/techdocs-ref: dir:.
    resiliency.idp/exposure-scope: 'internet-facing'
    resiliency.idp/dns-scope: 'public-authoritative'
    resiliency.idp/ingress-type: 'Cloud External Application Load Balancer (GCP TargetHttpsProxy)'
    resiliency.idp/software-stack: '[{"name":"React","version":"18.3.1","category":"framework","description":"Frontend UI component engine"},{"name":"TypeScript","version":"5.8.2","category":"runtime","description":"Type-safe compiler & type system"},{"name":"Material-UI","version":"5.16.7","category":"framework","description":"Google Material Design UI system"},{"name":"Backstage Core","version":"1.34.0","category":"framework","description":"Developer Portal Core Framework"},{"name":"Envoy / GCP Proxy","version":"1.30.1","category":"web-server","description":"Cloud External HTTPS Proxy & Ingress"}]'
    goharbor.io/repository-slug: 'aegis-ciam/aegis-ui'
    goharbor.io/host: 'harbor.aegis.internal:8880'
    goharbor.io/image-tag: 'v2.4.0'
    endoflife.date/products: 'react@18,nodejs@22,envoy@1.30,alpine@3.20'
    resiliency.idp/k8s-namespace: 'default'
    resiliency.idp/k8s-deployment: 'ui'
    resiliency.idp/k8s-baseline-replicas: '1'
    resiliency.idp/k8s-min-replicas: '1'
    resiliency.idp/k8s-max-replicas: '10'
    resiliency.idp/k8s-health-url: 'http://127.0.0.1:30080'
    resiliency.idp/ssl-provider: 'gcp-cloud-lb'
    resiliency.idp/ssl-renewal-mode: 'workflow-auto-renew'
    resiliency.idp/gcp-project: 'aegis-prod-cloud'
    resiliency.idp/gcp-target-https-proxy: 'aegis-ui-https-proxy'
    resiliency.idp/endpoints.dev: 'https://dev.ui.aegis.cloud.goog/healthz'
    resiliency.idp/endpoints.stg.web: 'https://stg-web.ui.aegis.cloud.goog/healthz'
    resiliency.idp/endpoints.stg.cdn: 'https://stg-cdn.ui.aegis.cloud.goog/healthz'
    resiliency.idp/endpoints.stg.canary: 'https://stg-canary.ui.aegis.cloud.goog/healthz'
    resiliency.idp/endpoints.stress-test: 'https://stress.ui.aegis.cloud.goog/healthz'
    resiliency.idp/endpoints.preprod: 'https://preprod.ui.aegis.cloud.goog/healthz'
    resiliency.idp/endpoints.prod: 'https://prod.ui.aegis.cloud.goog/healthz'
  links:
    - url: http://localhost:3000/create/templates/default/renew-gcp-lb-tls-cert?formData=%7B%22targetEntity%22%3A%22component%3Adefault%2Faegis-ui%22%7D
      title: Auto-Renew GCP Cloud LB SSL Cert
      icon: cloud
    - url: http://localhost:3000/create/templates/default/k8s-day2-operations?formData=%7B%22componentEntity%22%3A%22component%3Adefault%2Faegis-ui%22%2C%22operationType%22%3A%22scale%22%7D
      title: Scale K8s Replicas (Day-2)
      icon: dashboard
    - url: http://localhost:3000/create/templates/default/k8s-day2-operations?formData=%7B%22componentEntity%22%3A%22component%3Adefault%2Faegis-ui%22%2C%22operationType%22%3A%22rolling-restart%22%7D
      title: Rolling Restart Pods (Day-2)
      icon: refresh
spec:
  type: website
  lifecycle: experimental
  owner: team-aegis
  dependsOn:
    - component:aegis-auth
    - component:aegis-backend
