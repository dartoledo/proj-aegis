apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: aegis-db
  description: The primary PostgreSQL database storing CIAM metadata
  annotations:
    backstage.io/kubernetes-label-selector: 'app=db'
    resiliency.idp/k8s-namespace: 'default'
    resiliency.idp/k8s-deployment: 'db'
    resiliency.idp/k8s-baseline-replicas: '1'
    resiliency.idp/k8s-min-replicas: '1'
    resiliency.idp/k8s-max-replicas: '1'
    resiliency.idp/k8s-stateful: 'true'
    resiliency.idp/exposure-scope: 'strictly-private'
    resiliency.idp/dns-scope: 'private-split-horizon'
    resiliency.idp/ingress-type: 'Database Subnet / Non-Routable Private Wire'
    resiliency.idp/software-stack: '[{"name":"PostgreSQL","version":"16.2","category":"database","description":"Enterprise relational SQL engine (High CVE-2024-10979 in pg_dump)","cveStatus":"WARNING"},{"name":"OpenSSL","version":"3.0.13","category":"crypto-library","description":"Database TLS wire protocol encryption (High CVE-2024-6119)","cveStatus":"WARNING"},{"name":"PostGIS","version":"3.4.2","category":"database","description":"Spatial & geographic object extension","cveStatus":"SECURE"},{"name":"Alpine Linux","version":"3.19.4","category":"runtime","description":"Hardened minimal database container OS (Medium CVE-2024-58251)","cveStatus":"WARNING"}]'
    goharbor.io/repository-slug: 'aegis-ciam/aegis-db'
    goharbor.io/host: 'harbor.aegis.internal:8880'
    goharbor.io/image-tag: 'v16.2.0'
    endoflife.date/products: 'postgresql@16,openssl@3.0,alpine@3.19'
    resiliency.idp/ssl-provider: 'private-cloud-lb'
    resiliency.idp/ssl-renewal-mode: 'self-renewing-monitored'
    resiliency.idp/ssl-auto-renew-threshold-days: '15'
    resiliency.idp/endpoints.dev: 'https://dev.db.internal:5432'
    resiliency.idp/endpoints.stg: 'https://stg.db.internal:5432'
    resiliency.idp/endpoints.stress-test: 'https://stress.db.internal:5432'
    resiliency.idp/endpoints.preprod: 'https://preprod.db.internal:5432'
    resiliency.idp/endpoints.prod: 'https://prod.db.internal:5432'
  links:
    - url: http://localhost:3000/create/templates/default/k8s-day2-operations?formData=%7B%22componentEntity%22%3A%22resource%3Adefault%2Faegis-db%22%2C%22operationType%22%3A%22rolling-restart%22%7D
      title: Rolling Restart DB Pod (Day-2)
      icon: refresh
    - url: http://localhost:3000/create/templates/default/k8s-day2-operations?formData=%7B%22componentEntity%22%3A%22resource%3Adefault%2Faegis-db%22%2C%22operationType%22%3A%22ssl-remediate-crypto%22%7D
      title: SSL Remediate Crypto
      icon: key
  tags:
    - env:dev
    - env:stg
    - env:stress-test
    - env:preprod
    - env:prod
    - ssl-monitored
    - private-cloud-lb
    - ingress:strictly-private
    - dns:private-split-horizon
spec:
  type: database
  owner: team-aegis
