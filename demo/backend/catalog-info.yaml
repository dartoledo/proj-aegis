apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: aegis-backend
  description: Core backend service that connects to the database and serves CIAM data
  tags:
    - env:dev
    - env:stg
    - env:stress-test
    - env:preprod
    - env:prod
    - ssl-monitored
    - private-cloud-lb
    - ingress:strictly-private
    - dns:private-split-horizon
  annotations:
    backstage.io/kubernetes-label-selector: 'app=backend'
    backstage.io/techdocs-ref: dir:.
    resiliency.idp/exposure-scope: 'strictly-private'
    resiliency.idp/dns-scope: 'private-split-horizon'
    resiliency.idp/ingress-type: 'Private Cloud Load Balancer (VPC-Internal)'
    resiliency.idp/software-stack: '[{"name":"Node.js","version":"18.20.8","category":"runtime","description":"EOL Node.js 18 runtime — CRITICAL CVE-2026-111497 (V8/HTTP2 RCE) & CVE-2026-56850","cveStatus":"CRITICAL"},{"name":"Express","version":"4.21.2","category":"framework","description":"Core RESTful API microservice engine","cveStatus":"SECURE"},{"name":"TypeORM","version":"0.3.20","category":"framework","description":"Database ORM & schema migration manager","cveStatus":"SECURE"},{"name":"OpenSSL","version":"1.1.1w","category":"crypto-library","description":"EOL OpenSSL 1.1.1 — CRITICAL CVE-2024-0727 & CVE-2023-5678","cveStatus":"CRITICAL"},{"name":"pg (node-postgres)","version":"8.13.1","category":"database","description":"PostgreSQL 14 client pool (CVE-2025-1094 on DB server)","cveStatus":"WARNING"}]'
    goharbor.io/repository-slug: 'aegis-ciam/aegis-backend'
    goharbor.io/host: 'harbor.aegis.internal:8880'
    goharbor.io/image-tag: 'v1.9.2'
    endoflife.date/products: 'nodejs@18,postgresql@14,openssl@1.1.1,alpine@3.17'
    sonarqube.org/project-key: aegis-backend
    github.com/project-slug: internal-org/aegis-backend
    resiliency.idp/k8s-namespace: 'default'
    resiliency.idp/k8s-deployment: 'backend'
    resiliency.idp/k8s-baseline-replicas: '1'
    resiliency.idp/k8s-min-replicas: '1'
    resiliency.idp/k8s-max-replicas: '10'
    resiliency.idp/k8s-health-url: 'http://127.0.0.1:30002/items'
    resiliency.idp/ssl-provider: 'private-cloud-lb'
    resiliency.idp/ssl-renewal-mode: 'self-renewing-monitored'
    resiliency.idp/ssl-auto-renew-threshold-days: '15'
    resiliency.idp/endpoints.dev: 'https://dev.backend.internal:8443/items'
    resiliency.idp/endpoints.stg.api: 'https://stg-api.backend.internal:8443/items'
    resiliency.idp/endpoints.stg.grpc: 'https://stg-grpc.backend.internal:8443/items'
    resiliency.idp/endpoints.stg.batch: 'https://stg-batch.backend.internal:8443/items'
    resiliency.idp/endpoints.stress-test.load-1: 'https://stress-1.backend.internal:8443/items'
    resiliency.idp/endpoints.stress-test.legacy-audit: 'https://stress-legacy.backend.internal:8443/items'
    resiliency.idp/ssl-simulate-weak-crypto.stress-test.legacy-audit: 'true'
    resiliency.idp/endpoints.preprod: 'https://preprod.backend.internal:8443/items'
    resiliency.idp/endpoints.prod: 'https://prod.backend.internal:8443/items'
    resiliency.idp/exposure-scope.stress-test.legacy-audit: 'restricted-public'
  links:
    - url: http://localhost:3000/create/templates/default/k8s-day2-operations?formData=%7B%22componentEntity%22%3A%22component%3Adefault%2Faegis-backend%22%2C%22operationType%22%3A%22scale%22%7D
      title: Scale K8s Replicas (Day-2)
      icon: dashboard
    - url: http://localhost:3000/create/templates/default/k8s-day2-operations?formData=%7B%22componentEntity%22%3A%22component%3Adefault%2Faegis-backend%22%2C%22operationType%22%3A%22rolling-restart%22%7D
      title: Rolling Restart Pods (Day-2)
      icon: refresh
spec:
  type: service
  lifecycle: experimental
  owner: team-aegis
  dependsOn:
    - component:aegis-auth
    - resource:aegis-db
